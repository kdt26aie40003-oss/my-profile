<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git練習ページ</title>
  <style>
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #333;
      background-color: #f7f9fc;
    }
    h1 {
      color: #2c5aa0;
      border-bottom: 3px solid #2c5aa0;
      padding-bottom: 8px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ★課題1：タイトルを自分の名前に変えてコミットしよう -->
  <h1>ひかきん</h1>

  <div class="card">
    <h2>自己紹介</h2>
    <!-- ★課題2：自己紹介文を書いてコミットしよう -->
    <p>ひかきん</p>
  </div>

  <div class="card">
    <h2>好きなもの</h2>
    <!-- ★課題3：好きなものを3つ追加してコミットしよう -->
    <ul>
      <li>麻雀</li>
    </ul>
  </div>

  <div class="card">
    <h2>今日学んだこと</h2>
    <!-- ★課題4：別ブランチでこの部分を書いて、mainにマージしよう -->
    <p>git branch / git checkout / git add / git commit</p>
  </div>

  <footer>
    <p>&copy; 2026 Git練習ページ</p>
  </footer>

</body>
</html>
